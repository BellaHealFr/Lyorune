name: Report a bug (English)
description: Something does not work or is displayed wrongly.
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for taking the time to report this problem.
        In game, type `/lyorune bug`: the window prepares a report that you only have to paste below.
        Step by step guide: [docs/SIGNALER_UN_BUG.md](https://github.com/BellaHealFr/Lyorune/blob/main/docs/SIGNALER_UN_BUG.md#reporting-a-bug-english).
  - type: textarea
    id: report
    attributes:
      label: Report from /lyorune bug
      description: Paste here the report copied from the game (Ctrl+V). If the command does not answer, write "command unavailable" and copy the error message shown by the game.
      render: text
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: What were you doing when it happened?
      placeholder: "Example: in a 5 player dungeon, in combat, I had just changed specialization."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: dropdown
    id: frequency
    attributes:
      label: Does it happen again?
      options:
        - Every time
        - Often
        - Only once
        - I do not know
    validations:
      required: true
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: Essential for a display problem. Drag your images here.
  - type: input
    id: addons
    attributes:
      label: Other interface addons
      placeholder: "Example: ElvUI, Clique, VuhDo"
  - type: checkboxes
    id: checks
    attributes:
      label: Before sending
      options:
        - label: I use the latest version of Lyorune.
        - label: I looked at the open bugs and did not find this one.
