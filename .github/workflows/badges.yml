# Chiffres des badges (version, téléchargements GitHub) : recalculés toutes les heures et après chaque publication,
# rangés sur la branche « badges », que lisent les README et la page de profil par shields.io.
# La branche ne garde qu'un seul commit, réécrit seulement quand un chiffre change : l'historique de main reste propre.
name: Badges
on:
  schedule:
    - cron: "17 * * * *"
  workflow_run:
    workflows: [Publication]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: badges
  cancel-in-progress: false

jobs:
  badges:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Chiffres du moment
        run: python outils/badges.py "$RUNNER_TEMP/badges"
        env:
          PYTHONIOENCODING: utf-8
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Branche badges
        run: |
          cd "$RUNNER_TEMP/badges"
          if git -C "$GITHUB_WORKSPACE" fetch -q origin badges 2>/dev/null; then
            same=1
            for f in *.json; do
              git -C "$GITHUB_WORKSPACE" show "FETCH_HEAD:$f" 2>/dev/null | cmp -s - "$f" || same=0
            done
            if [ "$same" = 1 ]; then echo "Rien n'a changé."; exit 0; fi
          fi
          git init -q -b badges
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Chiffres des badges"
          git push -q -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" badges
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
