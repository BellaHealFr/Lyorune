# Publie la page de présentation de Lyorune sur GitHub Pages.
# outils/site.py fabrique la page à partir de site/src (textes français et anglais, gabarit, style, script),
# des images de docs/images, de la version (Lyorune.toc), des thèmes (Themes.lua) et des CHANGELOG.
name: Site
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "docs/images/**"
      - "Lyorune.toc"
      - "Themes.lua"
      - "CHANGELOG.md"
      - "CHANGELOG.en.md"
      - "outils/site.py"
      - ".github/workflows/site.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  site:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Fabrication de la page
        run: python outils/site.py github public
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v5
        with:
          path: public
      # GitHub met parfois quelques secondes à lister l'archive qui vient d'être envoyée (« Found 0 artifact(s) »)
      - name: Attente de l'archive
        run: sleep 20
      - id: deploiement
        uses: actions/deploy-pages@v5
