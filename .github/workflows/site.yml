# Publie la page de présentation de Lyorune (dossier site/) sur GitHub Pages.
# Les images sont reprises de docs/images, pour n'en garder qu'un exemplaire dans le dépôt.
# La version (Lyorune.toc) et la date du jour remplacent __VERSION__ et __DATE__ (données pour les moteurs de recherche) ;
# __BUILD__ (numéro du commit) force les navigateurs à recharger la feuille de style et les animations.
name: Site
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "docs/images/**"
      - "Lyorune.toc"
      - ".github/workflows/site.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  site:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - name: Assemblage de la page
        run: |
          mkdir -p public
          cp -r site/. public/
          mkdir -p public/images
          cp docs/images/*.png public/images/
          cp -r docs/images/runes docs/images/piliers public/images/
          touch public/.nojekyll
          version=$(grep -oP '## Version: \K\S+' Lyorune.toc)
          date=$(date -u +%Y-%m-%d)
          grep -rl -e __VERSION__ -e __DATE__ -e __BUILD__ public --include='*.html' --include='*.xml' --include='*.txt'             | xargs sed -i "s/__VERSION__/$version/g; s/__DATE__/$date/g; s/__BUILD__/${GITHUB_SHA::8}/g"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: public
      - id: deploiement
        uses: actions/deploy-pages@v4
