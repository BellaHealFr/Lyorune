# Publie Lyorune quand une étiquette de version (par exemple v1.4.0) est envoyée sur GitHub.
#   1. les tests tournent ;
#   2. l'étiquette doit correspondre à la version écrite dans Lyorune.toc ;
#   3. les notes de cette version sont extraites du journal ;
#   4. l'archive est attachée à une « release » GitHub, avec ces notes ;
#   5. l'archive part sur WoWInterface par outils/wowinterface.py (l'outil d'empaquetage ne relie pas le jeu
#      « forever » à WoWInterface) ; un refus de WoWInterface n'arrête rien (relance : circuit « WoWInterface ») ;
#   6. les notes sont annoncées sur Discord (secret DISCORD_WEBHOOK, facultatif).
#
# Pour publier aussi sur CurseForge, Wago et WoWInterface, ajoutez dans les secrets du dépôt CF_API_KEY,
# WAGO_API_TOKEN et WOWI_API_TOKEN, et dans Lyorune.toc les lignes « ## X-Curse-Project-ID: », « ## X-Wago-ID: »
# et « ## X-WoWI-ID: » avec vos identifiants de projet.
name: Publication
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publication:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install lupa
      - name: Tests
        run: python tests/run.py .
        env:
          PYTHONIOENCODING: utf-8
      - name: L'étiquette correspond à la version de l'addon
        run: |
          version=$(grep -oP '## Version: \K\S+' Lyorune.toc)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Etiquette $GITHUB_REF_NAME, mais Lyorune.toc indique $version" && exit 1
          fi
      - name: Notes de la version
        run: python outils/publier.py --notes "$GITHUB_REF_NAME"
        env:
          PYTHONIOENCODING: utf-8
      - uses: BigWigsMods/packager@v2
        env:
          GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
          WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }}
      - name: Envoi sur WoWInterface
        continue-on-error: true
        run: python outils/wowinterface.py "$GITHUB_REF_NAME" ".release/Lyorune-$GITHUB_REF_NAME-forever.zip"
        env:
          PYTHONIOENCODING: utf-8
          WOWI_API_TOKEN: ${{ secrets.WOWI_API_TOKEN }}
      - name: Annonce sur Discord
        run: python outils/annonce_discord.py "$GITHUB_REF_NAME"
        env:
          PYTHONIOENCODING: utf-8
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
