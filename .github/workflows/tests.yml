# Lance les tests de Zenith à chaque modification envoyée sur GitHub.
name: Tests
on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install lupa
      - run: python tests/run.py .
        env:
          PYTHONIOENCODING: utf-8
